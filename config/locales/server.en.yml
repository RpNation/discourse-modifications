      cooldown_hours:
        one: "You can bump this topic again in %{count} hour."
        other: "You can bump this topic again in %{count} hours."
      cooldown_minutes:
        one: "You can bump this topic again in %{count} minute."
        other: "You can bump this topic again in %{count} minutes."
